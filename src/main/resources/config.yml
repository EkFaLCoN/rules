# ==============================================================
# CursedValleyRules
# Eklenti SADECE asagidaki dunyada calisir. Diger dunyalarda
# (world, world_nether, world_the_end) hicbir olaya karismaz.
#
# Bu ad, Multiverse-Core'da gorunen dunya adiyla ayni olmali:
#   /mv list  ->  listedeki ad
# ==============================================================

world: cursedvalley

# Elytra ile suzulmeyi kapatir. Elytra takmak da engellenir.
block-elytra: true

# Ender incisi atmayi ve isinlanmayi kapatir. Inci harcanmaz.
block-ender-pearl: true

message-elytra: "&c&lCURSED VALLEY &7- &fBurada elytra ile uçamazsın."
message-ender-pearl: "&c&lCURSED VALLEY &7- &fBurada ender incisi kullanamazsın."

# ==============================================================
# Bowl bolgesi PvP kilidi
# Catisma sirasinda oyuncular bowl sinirindan cikamaz. Son vurustan
# sonra alt cubukta geri sayim baslar; sayim bitince cikis serbest.
# ==============================================================
bowl:
  lock-during-pvp: true
  center-x: 0
  center-z: 0
  radius: 85
  # Son vurustan sonra kac saniye cikis yasagi surer
  combat-seconds: 10

message-bowl: "&c&lBOWL &7- &fÇatışma sürerken bölgeden çıkamazsın."
